name: Pacote offline com atestacao do GitHub (KON-596)
# Ordem do David de 27-11-2026, 03:04: «empacotar tudo com o build_pacote_offline.py + atestação automática do GitHub».
# Corre os testes, constroi o ZIP offline com a edicao de 21 (edicao-21/) duas vezes (tem de sair igual,
# byte a byte), confere-o, ensaia-o num navegador (arranque, modo aviao, 3D)
# e pede ao GitHub uma atestacao de origem (Sigstore) para esse ZIP.
# Quem tiver o ZIP confere sem confiar em nos:
#   gh attestation verify KONFIRMU_EXECUTAVEL_OFFLINE_2030.zip --repo silvadvp-del/konfirmu-claim-protocol
# Nao cria release nem etiqueta. Nao publica nada fora do GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pacote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # assinatura sem chaves guardadas (Sigstore)
      attestations: write   # guarda a atestacao no repositorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testes do empacotador e do motor v2
        run: python3 -I tests/test_build_pacote_offline.py
      - name: Construir duas vezes e conferir
        run: |
          python3 -I scripts/build_pacote_offline.py --edicao-21 --base edicao-21 --saida dist
          python3 -I scripts/build_pacote_offline.py --edicao-21 --base edicao-21 --saida /tmp/segunda
          a=$(sha256sum dist/KONFIRMU_EXECUTAVEL_OFFLINE_2030.zip | cut -d' ' -f1)
          b=$(sha256sum /tmp/segunda/KONFIRMU_EXECUTAVEL_OFFLINE_2030.zip | cut -d' ' -f1)
          echo "primeira construcao: $a"
          echo "segunda construcao:  $b"
          test "$a" = "$b"
          python3 -I scripts/build_pacote_offline.py --verificar dist/KONFIRMU_EXECUTAVEL_OFFLINE_2030.zip
          {
            echo "## Pacote offline"
            echo ""
            echo "sha256 \`$a\` · duas construcoes iguais · commit \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ensaio no navegador (edicao de 21 do GPT) — arranque, modo aviao e controlos 3D
        run: |
          python3 -m pip install --quiet playwright==1.55.0
          python3 tests/test_imersao_offline.py dist/KONFIRMU_EXECUTAVEL_OFFLINE_2030.zip --atividades 21
      - name: Ensaio das tigelas da Educacao e familia — 8 tigelas, 62 linguas, modo aviao, memoria
        run: python3 tests/test_tigelas_familia.py dist/KONFIRMU_EXECUTAVEL_OFFLINE_2030.zip
      - name: Pacote do sitio dpsindustrial.nl/konfirmu/ — duas construcoes iguais, varredura e ensaio (KON-613)
        run: |
          python3 -I scripts/build_site_nl.py /tmp/nl_a
          # a segunda construcao parte de uma copia do repositorio noutro caminho: o caminho nao pode mudar os bytes
          cp -a "$GITHUB_WORKSPACE" /tmp/outra-copia-do-repositorio
          python3 -I /tmp/outra-copia-do-repositorio/scripts/build_site_nl.py /tmp/nl_b
          cmp /tmp/nl_a/konfirmu/SHA256SUMS.txt /tmp/nl_b/konfirmu/SHA256SUMS.txt
          diff -r /tmp/nl_a /tmp/nl_b
          # o ZIP offline do sitio tem de ser o mesmo, byte a byte, que o ZIP atestado neste fluxo
          cmp dist/KONFIRMU_EXECUTAVEL_OFFLINE_2030.zip /tmp/nl_a/konfirmu/app/konfirmu-offline-2030.zip
          (cd /tmp/nl_a/konfirmu && sha256sum --quiet -c SHA256SUMS.txt)
          python3 -I ferramentas/verificar_pacote.py /tmp/nl_a/konfirmu --estrito
          python3 tests/test_site_nl.py /tmp/nl_a
          node tests/test_kcp_ed_estrito.mjs
          python3 -I konfirmu_frugal_router.py --auto-teste
          echo "SHA-256 do SHA256SUMS.txt do sitio: $(sha256sum /tmp/nl_a/konfirmu/SHA256SUMS.txt | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Atestacao de origem do GitHub (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/KONFIRMU_EXECUTAVEL_OFFLINE_2030.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KONFIRMU_EXECUTAVEL_OFFLINE_2030
          path: |
            dist/KONFIRMU_EXECUTAVEL_OFFLINE_2030.zip
            dist/KONFIRMU_EXECUTAVEL_OFFLINE_2030.zip.sha256
            dist/PACOTE.json
            dist/SHA256SUMS.txt
          retention-days: 90

name: Copia do que esta no ar (so leitura, KON-613)
on:
  push:
    branches: [ "ferramenta/copia-ao-vivo-20261127" ]
permissions:
  contents: write
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar, duas vezes, cada caminho da lista (sem mexer no site)
        run: |
          set -u
          mkdir -p copia/1 copia/2
          while read -r p; do
            [ -z "$p" ] && continue
            n=$(printf '%s' "$p" | sed 's#[/.]#_#g')
            for v in 1 2; do
              code=$(curl -sS -m 40 -A "Konfirmu-copia-KON-613" -o "copia/$v/$n" -D "copia/$v/$n.cabecalhos" -w '%{http_code}' "https://dpsindustrial.nl$p" || echo 000)
              echo "$v $code $p" >> copia/ESTADOS.txt
            done
          done < ferramentas/copia_ao_vivo/caminhos.txt
          (cd copia && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          cat copia/ESTADOS.txt
      - name: Guardar a copia neste ramo (so este ramo; o site nao muda)
        run: |
          mkdir -p ferramentas/copia_ao_vivo/resultado
          rm -rf ferramentas/copia_ao_vivo/resultado/*
          cp -R copia/. ferramentas/copia_ao_vivo/resultado/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ferramentas/copia_ao_vivo/resultado
          git commit -m "Copia do que esta no ar ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "nada mudou"
          git push origin HEAD:ferramenta/copia-ao-vivo-20261127

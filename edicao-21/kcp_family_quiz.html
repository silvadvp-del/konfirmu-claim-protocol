<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz de sofá · Konfirmu</title>
<style>:root{color-scheme:dark}input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=color]),select,textarea,button{color:#F4F7FA;background-color:rgba(15,34,61,.72)}input,select,textarea,button{border-color:rgba(159,179,200,.24)}::placeholder{color:#9FB3C8;opacity:1}::file-selector-button{color:#F4F7FA;background:rgba(15,34,61,.72);border:1px solid #FF9E7D;border-radius:8px}input[type=range],input[type=checkbox],input[type=radio],progress{accent-color:#FF9E7D}option{background:#0B192C;color:#F4F7FA}*{box-sizing:border-box}body{margin:0;background:#0B192C;color:#F4F7FA;font:18px system-ui}main{max-width:760px;margin:auto;padding:5vh 5vw}header,nav,#answers{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}header{justify-content:space-between;color:#FF9E7D}h1{font:clamp(40px,9vw,76px) Georgia;margin:.35em 0}button,select{font:inherit;padding:.7em 1em;border-radius:12px;border:1px solid rgba(159,179,200,.24);color:inherit;background:#0B192C;cursor:pointer}button:hover,button:focus-visible{border-color:#FF9E7D}article{margin:1.3em 0;padding:1.3em;border:1px solid rgba(159,179,200,.24);border-radius:18px}#pic{background:rgba(15,34,61,.72);border-radius:12px;overflow:hidden;margin:1em 0;color:#F4F7FA}svg{display:block;width:100%;height:200px}#answers button{flex:1 1 40%}#note{color:#FF9E7D}#next{background:rgba(15,34,61,.72);color:#F4F7FA}small{letter-spacing:.08em}</style>
<main><header><b>Konfirmu</b><small>JOGO DE SALA</small></header><h1>Quiz de sofá</h1><nav><label>Partida <select id="mode"><option>Família</option><option>Adultos</option></select></label><span id="score"></span></nav><article><small id="tag"></small><h2 id="prompt"></h2><div id="pic"></div><div id="answers"></div><p aria-live="polite" id="note"></p><button id="next" hidden>Ronda seguinte →</button></article><p>Joguem em equipa ou passem o telemóvel à vez. Cada resposta certa vale um ponto.</p></main>
<script>
const el=id=>document.getElementById(id), rand=n=>Math.floor(Math.random()*n), scores=[[0,0],[0,0]];
let active,round=0,locked=false,frame;
function shuffle(items){for(let i=items.length-1;i>0;i--){const j=rand(i+1);[items[i],items[j]]=[items[j],items[i]]}return items}
function numeric(n,step=1){return [n,n+step,n+2*step,n+3*step].map(String)}
function question(adult,k){
 const a=2+rand(8),b=2+rand(8),truth=rand(2)===1;
 if(k===0){const shapes=['círculo','triângulo','quadrado','hexágono'],paths=['<circle cx="50" cy="50" r="34"/>','<path d="M50 10 L92 86 H8 Z"/>','<rect x="15" y="15" width="70" height="70"/>','<path d="M10 50 L30 15 H70 L90 50 L70 85 H30 Z"/>'],idx=rand(4),sides=[0,3,4,6][idx],correct=adult?(sides===0?'0':String(sides*(sides-3)/2)):shapes[idx];
 return {tag:'Ateliê · Zoom',q:adult?'Quantas diagonais tem a figura que está a aparecer?':'Que figura está a aparecer?',opts:adult?['0','2','5','9']:shapes,correct,why:adult?(sides?'Cada vértice liga-se a '+(sides-3)+' vértices não adjacentes. Divide-se a contagem por dois.':'O círculo não tem vértices.'):'A figura completa é um '+correct+'.',svg:paths[idx],zoom:true}}
 if(k===1){const n=(a+b)*(a+b),claim=truth?n:n-2*a*b;
 return {tag:'Verdade ou alucinação?',q:adult?'('+a+' + '+b+')² = '+claim+'?':a+' × '+b+' = '+(a*b+(truth?0:1))+'?',opts:['OK · Verdade','VETO · Falso'],correct:truth?'OK · Verdade':'VETO · Falso',why:adult?'A soma é '+(a+b)+' e o seu quadrado é '+n+'.':a+' grupos de '+b+' dão '+a*b+'.'}}
 const x=rand(2),y=rand(2),names=['Noroeste','Nordeste','Sudoeste','Sudeste'],lon=(x?1:-1)*a*10,lat=(y?-1:1)*b*8;
 return {tag:'Mapa · Coordenadas',q:adult?'Um ponto tem latitude '+lat+'° e longitude '+lon+'°. Em que quadrante fica?':'Em que direção fica a estrela em relação ao centro?',opts:names,correct:names[2*y+x],why:'Latitude '+(y?'sul':'norte')+' e longitude '+(x?'este':'oeste')+'.',svg:'<path d="M50 0V100 M0 50H100" fill="none" stroke="rgba(15,34,61,.72)"/><text x="50" y="9" font-size="8" text-anchor="middle">N</text>'+(!adult?'<text x="'+(x?72:20)+'" y="'+(y?78:32)+'" font-size="16">*</text>':'')}}
function tally(){const [wins,total]=scores[active];el('score').textContent=wins+' / '+total+' pontos'}
function play(){cancelAnimationFrame(frame);locked=false;active=el('mode').selectedIndex;tally();const r=question(active===1,round++%3);
 el('tag').textContent=r.tag;el('prompt').textContent=r.q;el('note').textContent='';el('next').hidden=true;el('pic').innerHTML=r.svg?'<svg viewBox="0 0 100 100" aria-hidden="true" fill="rgba(15,34,61,.72)">'+r.svg+'</svg>':'';const svg=el('pic').firstChild;
 if(r.zoom&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const start=performance.now();function zoom(t){const size=Math.min(100,12+(t-start)/35);svg.setAttribute('viewBox',[(100-size)/2,(100-size)/2,size,size].join(' '));if(size<100)frame=requestAnimationFrame(zoom)}frame=requestAnimationFrame(zoom)}
 el('answers').replaceChildren();for(const opt of shuffle([...r.opts])){const btn=document.createElement('button');btn.textContent=opt;btn.onclick=()=>{if(locked)return;locked=true;cancelAnimationFrame(frame);if(svg)svg.setAttribute('viewBox','0 0 100 100');scores[active][1]++;const ok=opt===r.correct;if(ok)scores[active][0]++;tally();el('note').textContent=(ok?'Certo! ':'Resposta correta: '+r.correct+'. ')+r.why;for(const other of el('answers').children)other.disabled=true;el('next').hidden=false;el('next').focus()};el('answers').append(btn)}}
el('mode').onchange=()=>{round=0;play()};el('next').onclick=play;play();
</script></html>

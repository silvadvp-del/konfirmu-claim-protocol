<body>
<h1><svg class="ki" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M5 11h14v9H5z"/><path d="M9 11V5h6v6"/><path d="M8 15h8"/></svg>Urna de Voto Offline — Konfirmu</h1>
<p>O carimbo secreto (Ed25519), o envelope fechado (compromisso sha256), o talão (hash) e a urna que deita fora as cópias. Tudo offline, como na escola.</p>

<div class="card">
<b>1. Eleitor — selar o voto</b><br>
<input id="nome" placeholder="O teu nome">
<select id="opcao"><option>Maçã</option><option>Banana</option><option>Bolachas</option></select>
<button onclick="selar()"><svg class="ki" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg>Fechar envelope e carimbar</button>
<pre id="talão">—</pre>
<canvas id="qr" style="display:none"></canvas>
</div>

<div class="card">
<b>2. Viajar sem internet (QR de mão em mão)</b><br>
<textarea id="envelope" rows="2" placeholder="cola aqui o envelope que recebeste (KONFIRMU|VOTO|…)</textarea>
</div>

<div class="card">
<b>3. Urna — conferir carimbos, apanhar batotas, contar</b><br>
<button onclick="urna()"><svg class="ki" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4v6H4z"/><path d="M12 3v9M8.5 8.5 12 12l3.5-3.5"/></svg>Receber envelope na urna</button> <button onclick="contar()"><svg class="ki" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.6-1.7"/><path d="M12 14v2.5"/></svg>Abrir a urna e contar</button>
<pre id="urnaOut">—</pre>
</div>

<p class="aviso">O que NÃO garante: a identidade é a CHAVE do aparelho (anti-batota real exige o registo de eleitores da escola — [VALIDAR]); o voto fica selado no envelope e só se abre na contagem (anonimato perfeito é [ROADMAP]); SELADO ≠ VERDADEIRO — a urna prova que ESTES envelopes não foram alterados nem duplicados; a hora é a do aparelho.</p>

<script>
function sha256Urna(str) {
  // SHA-256 puro, offline, sem bibliotecas externas (implementação compacta de domínio público;
  // verificada neste pacote contra os vetores NIST "abc" e vazio — ver TESTES.md/PROVA.md)
  function rightRotate(value, amount) { return (value>>>amount) | (value<<(32-amount)); }
  var ascii = unescape(encodeURIComponent(str));   // bytes UTF-8 como chars 0-255
  var mathPow = Math.pow, maxWord = mathPow(2,32);
  var result = '', words = [];
  var asciiBitLength = ascii.length*8;
  var hash = sha256Urna.h = sha256Urna.h || [];
  var k = sha256Urna.k = sha256Urna.k || [];
  var primeCounter = k.length, isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5)*maxWord)|0;
      k[primeCounter++] = (mathPow(candidate, 1/3)*maxWord)|0;
    }
  }
  ascii += '\x80';
  while (ascii.length%64 - 56) ascii += '\x00';
  for (var i = 0; i < ascii.length; i++) {
    var j = ascii.charCodeAt(i);
    words[i>>2] |= j << ((3 - i)%4)*8;
  }
  words[words.length] = (asciiBitLength/maxWord)|0;
  words[words.length] = (asciiBitLength);
  for (var jj = 0; jj < words.length;) {
    var w = words.slice(jj, jj += 16);
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (var i2 = 0; i2 < 64; i2++) {
      var w15 = w[i2-15], w2 = w[i2-2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))
        + ((e&hash[5])^((~e)&hash[6]))
        + k[i2]
        + (w[i2] = (i2 < 16) ? w[i2] : (
            w[i2-16] + (rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))
            + w[i2-7] + (rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
      var temp2 = (rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))
        + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1+temp2)|0].concat(hash);
      hash[4] = (hash[4]+temp1)|0;
    }
    for (var i3 = 0; i3 < 8; i3++) hash[i3] = (hash[i3]+oldHash[i3])|0;
  }
  for (var i4 = 0; i4 < 8; i4++) {
    for (var j4 = 3; j4 + 1; j4--) {
      var b = (hash[i4]>>(j4*8))&255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}
var envelopes = [];
function toHex(u8){ var s=""; for (var i=0;i<u8.length;i++) s += ("0"+u8[i].toString(16)).slice(-2); return s; }
function fromHex(h){ var u=new Uint8Array(h.length/2); for (var i=0;i<u.length;i++) u[i]=parseInt(h.substr(i*2,2),16); return u; }
function rnd32(){ var u=new Uint8Array(32); crypto.getRandomValues(u); return toHex(u); }
function selar(){
  var nome = document.getElementById("nome").value.trim();
  var opcao = document.getElementById("opcao").value;
  if(!nome){ alert("escreve o nome"); return; }
  var nonce = rnd32();
  var commitment = sha256Urna(opcao + "|" + nonce, false);      // o envelope FECHADO
  var kp = nacl.sign.keyPair();
  var alvo = "KONFIRMU-VOTO|v1|" + commitment;
  var sig = nacl.sign.detached(nacl.util.decodeUTF8(alvo), kp.secretKey);
  var env = { nome: nome, commitment: commitment, pk: toHex(kp.publicKey), sig: toHex(sig), nonce: nonce, opcao: opcao };
  document.getElementById("talão").textContent =
    "talão (o teu número mágico): " + commitment + "\npk: " + env.pk.slice(0,16) + "…\nguarda o talão para confirmar no fim!";
  var payload = "KONFIRMU|VOTO|v1|" + commitment + "|" + env.pk + "|" + env.sig;
  var c = document.getElementById("qr"); c.style.display = "block";
  var qr = qrcode(0,"M"); qr.addData(payload,"Byte"); qr.make();
  var n = qr.getModuleCount(), s = 3; c.width = n*s; c.height = n*s;
  var ctx = c.getContext("2d"); ctx.fillStyle = "#F4F7FA"; ctx.fillRect(0,0,c.width,c.height); ctx.fillStyle = "#000";
  for (var r=0;r<n;r++) for (var cc=0;cc<n;cc++) if (qr.isDark(r,cc)) ctx.fillRect(cc*s,r*s,s,s);
  // guardar em memória local para a urna (na mesma escola)
  envelopes.push(env);
  document.getElementById("envelope").value = payload;
}
function urna(){
  var txt = document.getElementById("envelope").value.trim();
  var out = document.getElementById("urnaOut");
  var m = txt.match(/^KONFIRMU\|VOTO\|v1\|([0-9a-f]{64})\|([0-9a-f]{64})\|([0-9a-f]{128})$/);
  if(!m){ out.textContent = "envelope ilegível"; out.className = "vermelho"; return; }
  var commitment = m[1], pk = m[2], sig = m[3];
  var alvo = "KONFIRMU-VOTO|v1|" + commitment;
  var okSig = KCP_ED.verificar(nacl.util.decodeUTF8(alvo), sig, pk);
  if(!okSig){ out.textContent = "VETO — carimbo falso (assinatura inválida)"; out.className = "vermelho"; return; }
  if(envelopes.some(function(e){ return e.pk === pk; })){
    out.textContent = "VETO — cópia: esta pessoa já votou (mesmo carimbo)"; out.className = "vermelho"; return;
  }
  // reconstituir o envelope a partir do QR: falta nonce+opcao (viajam com o eleitor, revelam na contagem)
  envelopes.push({ nome: "(do QR)", commitment: commitment, pk: pk, sig: sig, nonce: null, opcao: null });
  out.textContent = "OK — envelope recebido: " + commitment.slice(0,24) + "…"; out.className = "verde";
}
function contar(){
  var out = document.getElementById("urnaOut");
  if(!envelopes.length){ out.textContent = "urna vazia"; return; }
  var contagem = {};
  var linhas = [];
  var duplicados = 0;
  var vistos = {};
  envelopes.forEach(function(e){
    if(vistos[e.pk]){ duplicados++; return; }
    vistos[e.pk] = true;
    var okComp = e.opcao !== null && sha256Urna(e.opcao + "|" + e.nonce, false) === e.commitment;
    if(!okComp){ linhas.push("VETO — envelope sem revelação válida (" + e.nome + ")"); return; }
    contagem[e.opcao] = (contagem[e.opcao] || 0) + 1;
    linhas.push(e.nome + ": talão " + e.commitment.slice(0,12) + "… contou como «" + e.opcao + "»");
  });
  linhas.push("RESULTADO: " + JSON.stringify(contagem) + (duplicados ? " · cópias deitadas fora: " + duplicados : ""));
  out.textContent = linhas.join("\n");
  out.className = "verde";
}
</script>

<dl aria-label="Avisos legais">
<dt>Fase de ensaio</dt><dd>A Konfirmu está em fase de ensaio técnico. As funções sem rede, de verificação e de assistência podem mudar ou falhar. Não há garantia de funcionamento contínuo.</dd>
<dt>Emergências</dt><dd>A Konfirmu não é um serviço de emergência e não liga nem avisa ninguém por ti. Em perigo imediato, liga 112, o número europeu de emergência.</dd>
<dt>Respostas automáticas e IA</dt><dd>O assistente da Konfirmu é um sistema automático, não uma pessoa. Algumas respostas são escritas por uma IA (inteligência artificial) e podem ter erros ou falhas. Não são aconselhamento jurídico, médico nem financeiro. Confirma sempre na fonte oficial.</dd>
<dt>Selos e prova</dt><dd>Um selo mostra se um ficheiro mudou desde que foi selado. Usa um resumo criptográfico baseado em SHA-256 e uma assinatura feita no teu aparelho. Selado não quer dizer verdadeiro: o selo não confirma o que o ficheiro diz. A hora do selo vem do relógio do aparelho e não é um selo temporal qualificado. O valor como prova depende da lei e dos tribunais de cada país.</dd>
<dt>Privacidade</dt><dd>Os selos, a verificação e o que guardas nestas páginas ficam no teu aparelho; nenhuma delas envia os teus ficheiros para servidores. A IA do chat de bolso corre no teu aparelho. Na app Konfirmu, com rede, as perguntas ao assistente podem ser enviadas a um serviço de IA na União Europeia (Mistral AI) para gerar a resposta.</dd>

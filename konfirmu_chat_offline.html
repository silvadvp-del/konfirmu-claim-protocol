/* ---------- SHA-256 (WebCrypto, com reserva em JS puro para páginas sem cadeado) ---------- */
function sha256js(bytes){const K=[],H=[];let n=2,c=0;const f=x=>(x-Math.floor(x))*4294967296|0;
 while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}if(p){if(c<8)H[c]=f(Math.pow(n,.5));K[c++]=f(Math.pow(n,1/3))}n++}
 const l=bytes.length,bl=((l+9+63)>>6)<<6,m=new Uint8Array(bl);m.set(bytes);m[l]=128;const dv=new DataView(m.buffer);
 dv.setUint32(bl-8,Math.floor(l/536870912));dv.setUint32(bl-4,(l<<3)>>>0);const w=new Int32Array(64),r=(x,s)=>(x>>>s)|(x<<(32-s));
 for(let o=0;o<bl;o+=64){for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
  for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(b,17)^r(b,19)^(b>>>10)))|0}
  let[a,b,c2,d,e,f2,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f2)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c2)^(b&c2)))|0;h=g;g=f2;f2=e;e=(d+t1)|0;d=c2;c2=b;b=a;a=(t1+t2)|0}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c2)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f2)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
async function sha256b(b,forcaJS){
 if(!forcaJS&&globalThis.crypto&&crypto.subtle){try{const d=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(_){}}
 return sha256js(b)}

const sha256=(txt,forcaJS)=>sha256b(new TextEncoder().encode(txt),forcaJS);

/* ---------- portão por regras (contas em inteiros, milionésimos) ---------- */
const REGRAS={nitrato:{tipo:'max',lim:50,un:'mg/L',chave:/nitrat/i},frio:{tipo:'faixa',a:2,b:8,un:'°C',chave:/frio|vacin|cold|froid|vaccin|°\s*c|º\s*c|\bgraus\b|\bdegr/i}};
const micro=s=>Math.round(parseFloat(String(s).replace(',','.'))*1e6);
function lerMedida(txt){const m=txt.match(/(-?\d+(?:[.,]\d+)?)\s*(?:(?:±|\+\/-|\+-)\s*(\d+(?:[.,]\d+)?))?/);if(!m)return null;
 const v=micro(m[1]),u=m[2]?micro(m[2]):0;if(!Number.isFinite(v)||!Number.isFinite(u))return null;return{v,u,lo:v-u,hi:v+u}}
function portao(txt){let nome=null;for(const k in REGRAS)if(REGRAS[k].chave.test(txt)){nome=k;break}
 if(!nome)return null;const r=REGRAS[nome],m=lerMedida(txt.replace(/2\s*(a|to|à|-)\s*8\s*°?\s*c/i,''));if(!m)return null;
 let ver;if(r.tipo==='max'){const Lm=r.lim*1e6;ver=m.hi<=Lm?'OK':m.lo>Lm?'VETO':'NS'}
 else{const a=r.a*1e6,b=r.b*1e6;ver=(m.lo>=a&&m.hi<=b)?'OK':(m.hi<a||m.lo>b)?'VETO':'NS'}
 const f=x=>String(x/1e6).replace('.',L==='en'?'.':',');
 return{regra:nome,ver,medida:m,txt:f(m.v)+(m.u?' ± '+f(m.u):'')+' '+r.un,lim:r.lim,a:r.a,b:r.b}}

/* ---------- cadeia da conversa ---------- */
const ZERO='0'.repeat(64);let cadeia=[],ponta=ZERO,bd=null;
function abrirBD(){return new Promise(r=>{try{const q=indexedDB.open('konfirmu_chat',1);q.onupgradeneeded=()=>q.result.createObjectStore('r',{keyPath:'n'});q.onsuccess=()=>r(q.result);q.onerror=q.onblocked=()=>r(null)}catch(_){r(null)}})}
const bdOp=(modo,f)=>new Promise(r=>{if(!bd)return r(null);try{const tx=bd.transaction('r',modo),q=f(tx.objectStore('r'));tx.oncomplete=()=>r(q.result);tx.onerror=tx.onabort=()=>r(null)}catch(_){r(null)}});
const corpo=e=>JSON.stringify([e.n,e.ts,e.q,e.a,e.ver,e.prev]);
async function registar(q,a,ver){const e={n:cadeia.length+1,ts:new Date().toISOString(),q,a,ver,prev:ponta};e.hash=await sha256(corpo(e));ponta=e.hash;cadeia.push(e);await bdOp('readwrite',s=>s.put(e));return e}
async function conferirCadeia(pk){if(!pk||pk.schema!=='KONFIRMU-CHAT/1'||!Array.isArray(pk.registos))return{ok:false,erro:true};
 let prev=ZERO;for(let i=0;i<pk.registos.length;i++){const e=pk.registos[i];if(e.n!==i+1||e.prev!==prev||await sha256(corpo(e))!==e.hash)return{ok:false,em:i+1};prev=e.hash}
 if(pk.ponta!==prev||pk.n!==pk.registos.length)return{ok:false,em:pk.registos.length};return{ok:true,n:pk.registos.length}}
const pacote=()=>({schema:'KONFIRMU-CHAT/1',n:cadeia.length,ponta,registos:cadeia});

/* ---------- selo de texto ---------- */
const limpar=s=>s.normalize('NFC').replace(/ /g,' ').split(/\r?\n/).map(l=>l.replace(/[ \t]+$/,'')).join('\n').replace(/\n+$/,'');
async function selo(a,b){const ha=await sha256(limpar(a));if(!b||!limpar(b))return{ver:'NS',hash:ha};const hb=await sha256(limpar(b));return{ver:ha===hb?'OK':'VETO',hash:ha}}

/* ---------- ecrã ---------- */
function bolha(quem,texto,ver,seloTxt,n){const d=document.createElement('div');d.className='b '+quem;
 if(ver){const v=document.createElement('span');v.className='v '+({OK:'ok',VETO:'veto',NS:'ns',IA:'ia'})[ver];v.textContent=t(ver);d.appendChild(v);d.appendChild(document.createElement('br'))}
 d.appendChild(document.createTextNode(texto));
 if(seloTxt){const s=document.createElement('span');s.className='selo';s.textContent='sha256 '+seloTxt.slice(0,16)+'… · n.º '+(n||cadeia.length);d.appendChild(s)}
 $('conversa').appendChild(d);$('conversa').scrollTop=$('conversa').scrollHeight}
let ia=null;
async function responder(q){const g=portao(q);let a,ver;
 if(g){ver=g.ver;a=(g.regra==='nitrato'?t('nit')(g):t('fri')(g))+(ver==='NS'?'\n'+t('nsPorque'):'')+'\n'+t('naoGarante')}
 else if(ia){ver='IA';try{const o=await ia([{role:'system',content:'Answer briefly and plainly, in the language of the user. You never give numbers, limits, doses or deadlines: say that those must come from a written rule.'},{role:'user',content:q}],{max_new_tokens:160});a=o[0].generated_text.at(-1).content}catch(_){ver='NS';a=t('iaFalhou')}}
 else{ver='NS';a=t('semRegra')}
 const e=await registar(q,a,ver);return{a,ver,hash:e.hash}}
async function enviar(){const q=$('p').value.trim();if(!q)return;$('p').value='';bolha('eu',q);const r=await responder(q);bolha('casa',r.a,r.ver,r.hash)}
async function ligarIA(){if(location.protocol==='file:'||!globalThis.isSecureContext){bolha('casa',t('iaFicheiro'));return}
 bolha('casa',t('iaABaixar'));try{const m=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
  const gpu=!!navigator.gpu;ia=await m.pipeline('text-generation','onnx-community/Qwen2.5-0.5B-Instruct',{dtype:gpu?'q4f16':'q8',device:gpu?'webgpu':'wasm'});bolha('casa',t('iaPronta'))}
 catch(_){ia=null;bolha('casa',t('iaFalhou'))}}
async function partilhar(txt,nome,tipo){try{const f=new File([txt],nome,{type:tipo});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Konfirmu'});return}}catch(_){}

async function importar(ev){const f=ev.target.files[0];if(!f)return;let r;try{r=await conferirCadeia(JSON.parse(await f.text()))}catch(_){r={ok:false,erro:true}}
 bolha('casa',r.ok?t('impOk')(r.n):r.erro?t('impErro'):t('impMau')(r.em),r.ok?'OK':r.erro?'NS':'VETO');ev.target.value=''}
async function conferirSelo(){const r=await selo($('tA').value,$('tB').value);bolha('casa',r.ver==='OK'?t('seloIgual'):r.ver==='VETO'?t('seloDif'):t('seloSo')+'\n'+r.hash,r.ver)}

/* ---------- modem de som: FSK 1850/2350 Hz, 35 ms por bit, CRC-16 ---------- */
const SOM={f0:1850,f1:2350,fs:1400,bit:.035,sinc:.2,max:120};
function crc16(b){let c=0xFFFF;for(const x of b){c^=x<<8;for(let i=0;i<8;i++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c}
function somBits(txt){const p=new TextEncoder().encode(txt);if(!p.length||p.length>SOM.max)return null;
 const f=new Uint8Array(p.length+5);f[0]=0xAA;f[1]=0x4B;f[2]=p.length;f.set(p,3);const c=crc16(f.subarray(1,p.length+3));f[p.length+3]=c>>8;f[p.length+4]=c&255;
 const bits=[];for(const y of f)for(let i=7;i>=0;i--)bits.push((y>>i)&1);return bits}
function somOnda(bits,sr){const nb=sr*SOM.bit,ns=Math.round(sr*SOM.sinc),tot=ns+Math.ceil(bits.length*nb)+Math.round(sr*.05),o=new Float32Array(tot);let ph=0;
 for(let i=0;i<tot;i++){let f=SOM.fs;if(i>=ns){const k=Math.floor((i-ns)/nb);f=k<bits.length?(bits[k]?SOM.f1:SOM.f0):0}
  if(f){ph+=2*Math.PI*f/sr;o[i]=.6*Math.sin(ph)}}
 const r=Math.round(sr*.01);for(let i=0;i<r;i++)o[i]*=i/r;return o}
function goertzel(s,a,n,f,sr){const c=2*Math.cos(2*Math.PI*f/sr);let q1=0,q2=0;for(let i=a;i<a+n;i++){const q0=c*q1-q2+s[i];q2=q1;q1=q0}return q1*q1+q2*q2-q1*q2*c}
function somLer(s,sr){const nb=sr*SOM.bit,n=Math.floor(nb),passo=Math.max(1,Math.floor(nb/8));
 const bitEm=(ini,k)=>{const a=Math.round(ini+k*nb);if(a+n>s.length)return -1;return goertzel(s,a,n,SOM.f1,sr)>goertzel(s,a,n,SOM.f0,sr)?1:0};
 const byteEm=(ini,k)=>{let v=0;for(let i=0;i<8;i++){const b=bitEm(ini,k*8+i);if(b<0)return -1;v=v<<1|b}return v};
 const casa=(ini,k,val)=>{for(let i=0;i<8;i++)if(bitEm(ini,k*8+i)!==((val>>(7-i))&1))return false;return true};
 for(let ini=0;ini+40*nb<s.length;ini+=passo){if(!casa(ini,0,0xAA)||!casa(ini,1,0x4B))continue;
  const L=byteEm(ini,2);if(L<1||L>SOM.max)continue;const tudo=new Uint8Array(L+2);tudo[0]=0x4B;tudo[1]=L;let ok=true;
  for(let i=0;i<L;i++){const v=byteEm(ini,3+i);if(v<0){ok=false;break}tudo[2+i]=v}
  if(!ok)continue;const ch=byteEm(ini,3+L),cl=byteEm(ini,4+L);if(ch<0||cl<0||crc16(tudo)!==(ch<<8|cl))continue;
  try{return new TextDecoder('utf-8',{fatal:true}).decode(tudo.subarray(2))}catch(_){}}
 return null}
const AC=()=>new(globalThis.AudioContext||globalThis.webkitAudioContext)();
async function somEnviar(){let m=$('p').value.trim();if(!m){if(!cadeia.length){bolha('casa',t('somNada'));return}const e=cadeia[cadeia.length-1];m='K1|'+e.n+'|'+e.ver+'|'+e.hash.slice(0,32)}
 const bits=somBits(m);if(!bits){bolha('casa',t('somGrande'));return}
 try{const ctx=AC(),o=somOnda(bits,ctx.sampleRate),buf=ctx.createBuffer(1,o.length,ctx.sampleRate);buf.getChannelData(0).set(o);
  const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.onended=()=>ctx.close();src.start();
  $('p').value='';bolha('eu','♪ '+m);bolha('casa',t('somATocar')(Math.ceil(o.length/ctx.sampleRate)))}
 catch(_){bolha('casa',t('somSemSom'))}}
async function somOuvir(){let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(_){bolha('casa',t('somSemMic'));return}
 bolha('casa',t('somAOuvir'));const ctx=AC(),src=ctx.createMediaStreamSource(st),pr=ctx.createScriptProcessor(4096,1,1),ped=[];let total=0,fim=false;const t0=Date.now();
 const parar=m=>{if(fim)return;fim=true;pr.disconnect();src.disconnect();st.getTracks().forEach(x=>x.stop());ctx.close();bolha('casa',m==null?t('somFalhou'):t('somRecebido')(m),m==null?'NS':null)};
 pr.onaudioprocess=e=>{if(fim)return;const d=e.inputBuffer.getChannelData(0);ped.push(new Float32Array(d));total+=d.length};src.connect(pr);pr.connect(ctx.destination);
 const ver=()=>{if(fim)return;const s=new Float32Array(total);let o=0;for(const x of ped){s.set(x,o);o+=x.length}
  const m=somLer(s,ctx.sampleRate);if(m!=null)parar(m);else if(Date.now()-t0>30000)parar(null);else setTimeout(ver,2500)};setTimeout(ver,2500)}

/* ---------- foto leve em pacotes (KI1): 150 bytes por pacote, 1 de reserva por cada 4 ---------- */
const PAC={tam:150,grupo:4};
const b64=u=>{let x='';for(const y of u)x+=String.fromCharCode(y);return btoa(x)};
const d64=x=>{const b=atob(x),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function fotoComprimir(file,larg=180,q=.22){const bm=await createImageBitmap(file),e=Math.min(1,larg/bm.width),c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(bm.width*e));c.height=Math.max(1,Math.round(bm.height*e));c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 let bl=await new Promise(r=>c.toBlob(r,'image/webp',q));if(!bl||bl.type!=='image/webp')bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.3));
 return{bytes:new Uint8Array(await bl.arrayBuffer()),tipo:bl.type,larg:c.width,alt:c.height}}
async function fotoPacotes(bytes,tipo){const h=await sha256b(bytes),id=h.slice(0,8),n=Math.ceil(bytes.length/PAC.tam),ps=['KI1|'+id+'|H|'+n+'|'+bytes.length+'|'+tipo+'|'+h];let par=null,np=0;
 for(let i=0;i<n;i++){const c=new Uint8Array(PAC.tam);c.set(bytes.subarray(i*PAC.tam,(i+1)*PAC.tam));ps.push('KI1|'+id+'|D|'+(i+1)+'|'+b64(c));
  if(!par)par=new Uint8Array(PAC.tam);for(let j=0;j<PAC.tam;j++)par[j]^=c[j];
  if((i+1)%PAC.grupo===0||i===n-1){np++;ps.push('KI1|'+id+'|P|'+np+'|'+b64(par));par=null}}
 return{id,sha:h,bytes:bytes.length,n,reserva:np,pacotes:ps}}
async function fotoJuntar(linhas){let H=null;const D=new Map(),P=new Map();
 for(const l of linhas){const p=l.trim().split('|');if(p[0]!=='KI1')continue;try{
  if(p[2]==='H'&&p.length===7){if(!H)H={id:p[1],n:+p[3],bytes:+p[4],tipo:p[5],sha:p[6]}}
  else if(p.length===5&&(p[2]==='D'||p[2]==='P')){const u=d64(p[4]);if(u.length===PAC.tam)(p[2]==='D'?D:P).set(p[1]+'|'+p[3],u)}}catch(_){}}
 if(!H||!(H.n>0)||!(H.bytes>0)||H.bytes>H.n*PAC.tam||H.n>4000)return{ver:'NS',faltam:0};
 const pega=(m,i)=>m.get(H.id+'|'+i),G=Math.ceil(H.n/PAC.grupo),tudo=new Uint8Array(H.n*PAC.tam);let faltam=0,recuperados=0;
 for(let g=0;g<G;g++){const a=g*PAC.grupo+1,b=Math.min(H.n,a+PAC.grupo-1),falta=[];for(let i=a;i<=b;i++)if(!pega(D,i))falta.push(i);
  if(falta.length===1&&pega(P,g+1)){const r=pega(P,g+1).slice();for(let i=a;i<=b;i++){const c=pega(D,i);if(c)for(let j=0;j<PAC.tam;j++)r[j]^=c[j]}D.set(H.id+'|'+falta[0],r);falta.length=0;recuperados++}
  faltam+=falta.length;if(!falta.length)for(let i=a;i<=b;i++)tudo.set(pega(D,i),(i-1)*PAC.tam)}
 if(faltam)return{ver:'NS',faltam};const bytes=tudo.slice(0,H.bytes);
 if(await sha256b(bytes)!==H.sha)return{ver:'VETO'};
 return{ver:'OK',sha:H.sha,bytes,recuperados,tipo:/^image\/(webp|jpeg)$/.test(H.tipo)?H.tipo:'image/webp'}}
function bolhaImg(bytes,tipo,texto,ver){bolha('casa',texto,ver);const im=document.createElement('img');im.src=URL.createObjectURL(new Blob([bytes],{type:tipo}));im.alt='';im.style.cssText='display:block;max-width:100%;border-radius:8px;margin-top:8px';$('conversa').lastChild.appendChild(im)}
async function fotoEscolhida(ev){const f=ev.target.files[0];ev.target.value='';if(!f)return;
 try{const c=await fotoComprimir(f),k=await fotoPacotes(c.bytes,c.tipo);bolhaImg(c.bytes,c.tipo,t('fotoOk')(k.bytes,k.n,k.reserva)+'\nsha256 '+k.sha.slice(0,16)+'…');await partilhar(k.pacotes.join('\n'),'konfirmu_foto_'+k.id+'.txt','text/plain')}
 catch(_){bolha('casa',t('fotoFalhou'),'NS')}}
async function pacEscolhidos(ev){const f=ev.target.files[0];ev.target.value='';if(!f)return;let r;try{r=await fotoJuntar((await f.text()).split(/\r?\n/))}catch(_){r={ver:'NS',faltam:0}}
 if(r.ver==='OK')bolhaImg(r.bytes,r.tipo,t('pacOk'),'OK');else if(r.ver==='VETO')bolha('casa',t('pacMau'),'VETO');else bolha('casa',r.faltam?t('pacFalta')(r.faltam):t('pacLixo'),'NS')}
let apgArmado=0;
async function apagar(){if(Date.now()>apgArmado){apgArmado=Date.now()+4000;$('cApg').textContent=t('apgMesmo');setTimeout(()=>{$('cApg').textContent=t('apg')},4000);return}
 apgArmado=0;await bdOp('readwrite',s=>s.clear());cadeia=[];ponta=ZERO;$('conversa').textContent='';$('cApg').textContent=t('apg');bolha('casa',t('ola'));bolha('casa',t('apagado'))}
async function arrancar(){pintar();bolha('casa',t('ola'));bd=await abrirBD();if(!bd){bolha('casa',t('semGuardar'));return}
 const rs=await bdOp('readonly',s=>s.getAll())||[];if(!rs.length)return;
 const r=await conferirCadeia({schema:'KONFIRMU-CHAT/1',n:rs.length,ponta:rs[rs.length-1].hash,registos:rs});
 if(!r.ok){bd=null;bolha('casa',t('guardadoMau'),'VETO');return}
 cadeia=rs;ponta=rs[rs.length-1].hash;for(const e of rs){bolha('eu',e.q);bolha('casa',e.a,e.ver,e.hash,e.n)}bolha('casa',t('guardado')(rs.length))}
function pintar(){document.documentElement.lang={pt:'pt-PT',en:'en',fr:'fr'}[L];$('aviso').textContent=t('aviso');$('p').placeholder=t('ph');$('enviar').textContent=t('enviar');
 for(const[id,k]of[['cAgua','agua'],['cFrio','frio'],['cSelo','selo'],['cIA','ia'],['cFoto','foto'],['cPac','pac'],['cSomE','somE'],['cSomO','somO'],['cApg','apg'],['cExp','exp'],['cImp','imp'],['lA','lA'],['lB','lB'],['bSelo','bSelo']])$(id).textContent=t(k)}
$('lingua').onchange=e=>{L=e.target.value;pintar()};$('enviar').onclick=enviar;$('p').onkeydown=e=>{if(e.key==='Enter')enviar()};

const nav=(navigator.language||'pt').slice(0,2);if(T[nav]){L=nav;$('lingua').value=nav}
const pronto=arrancar();
if(location.protocol!=='file:'&&globalThis.isSecureContext&&'serviceWorker'in navigator)navigator.serviceWorker.register('konfirmu_chat_sw.js').catch(()=>{});
globalThis.KONFIRMU={sha256,sha256js,portao,selo,responder,conferirCadeia,pacote,limpar,pronto,crc16,sha256b,fotoComprimir,fotoPacotes,fotoJuntar,somBits,somOnda,somLer,definirLingua:l=>{L=l;pintar()}};

<canvas id="palco" aria-hidden="true"></canvas>

</header>
<main id="familia">
  <section class="cabeca">

    <p class="sub" data-m="fam.sub"></p>
  </section>
  <div class="barra-botoes">
    <button id="b-entrar" class="pilula solar" type="button" data-ico="tigela"><span data-t="entrar">Entrar no Modo Criança</span></button>
    <button id="b-filme" class="pilula vidro" type="button" data-ico="filme"><span data-t="filme">Filme</span></button>

  </div>
  <section id="cartao" class="cartao vidro" aria-live="polite">
    <div class="cartao-ico" id="c-ico"></div>

    <a id="c-abrir" class="abrir solar" href="#" data-ico="seta"></a>
  </section>
  <div class="setas">
    <button id="b-ant" class="seta vidro" type="button" data-ico="voltar" aria-label="‹"></button>
    <a id="entrada" class="entrada vidro" href="#" data-ico="toque"><span><b data-m="fam.comeca">Começa aqui</b> <span data-m="fam.girafinhas.t"></span></span></a>
    <button id="b-seg" class="seta vidro" type="button" data-ico="seta" aria-label="›"></button>
  </div>
  <p class="rodape"><span data-t="privado">Funciona sem internet. Nada sai deste aparelho.</span></p>
</main>
<main id="crianca" hidden>
  <div class="barra-crianca">
    <p class="instrucao vidro" data-t="toca">Toca para encher a tigela</p>
    <button id="b-sair" class="sair vidro" type="button" data-t="sair">Sair (adulto)</button>
  </div>
  <div class="final vidro" id="final" hidden>
    <h2 data-t="todas">Encheste as 8 tigelas!</h2>
    <button class="pilula solar" id="b-denovo" type="button" data-t="de_novo">Outra vez</button>
  </div>
</main>
<main id="filme" hidden>
  <button id="b-fechar" class="fechar vidro" type="button" data-ico="fechar"></button>
  <div id="contador" class="contador" hidden></div>
  <div id="marca-filme" class="marca-filme" hidden><div class="marca grande">Konfirm<span class="u">u</span></div><p id="f-lema"></p><p id="f-nota" class="nota"></p></div>

  <div class="regua"><span id="f-cena"></span><span>Filme Manifesto · em ensaio</span><i id="f-prog"></i></div>
</main>
<div class="modal" id="pin" hidden role="dialog" aria-modal="true" aria-labelledby="pin-titulo">
  <div class="caixa vidro">
    <h2 id="pin-titulo"></h2>
    <div class="pinos" id="pinos" aria-hidden="true"></div>
    <p class="erro" id="pin-erro" role="alert"></p>
    <div class="teclado" id="teclado"></div>
    <p class="nota-pin"><span data-t="dica"></span> <span data-t="esqueci"></span></p>
    <p class="nota-pin marca-ia" data-t="traducao_ia" hidden></p>
    <div class="acoes-pin">
      <button class="pilula vidro" id="b-cancelar" type="button" data-t="cancelar">Cancelar</button>
      <button class="pilula vidro" id="b-pin-bio" type="button" hidden data-t="biometria">Impressão digital ou rosto</button>
    </div>
  </div>
</div>
<div class="aviso vidro" id="aviso" role="status" aria-live="polite" hidden></div>

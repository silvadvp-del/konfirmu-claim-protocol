body { font-family: system-ui, sans-serif; background: #fef3c7; color: #451a03; min-height: 100dvh; display: flex; flex-direction: column; padding: 12px; gap: 12px; }
.top-bar { background: #fbbf24; border-radius: 20px; padding: 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 0 #d97706; }

.big-grid { display: grid; grid-template-columns: 1fr; gap: 14px; flex: 1; }
.game-card { background: #fff; border: 4px solid #f59e0b; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; box-shadow: 0 6px 0 #d97706; }
.card-label { font-size: 1.25rem; font-weight: 800; }
.bowls-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
.bowl { font-size: 2.1rem; padding: 12px 4px; border-radius: 16px; background: #fef9c3; border: 3px solid #eab308; cursor: pointer; }
.bowl.counted { background: #bbf7d0; border-color: #16a34a; }
.ruler-box { width: 100%; padding: 16px; border-radius: 18px; font-size: 1.35rem; font-weight: 900; }
.ruler-same { background: #bbf7d0; border: 4px solid #16a34a; color: #14532d; }
.ruler-diff { background: #fecaca; border: 4px solid #dc2626; color: #7f1d1d; }
.action-giant { width: 100%; padding: 16px; border-radius: 18px; border: none; font-size: 1.15rem; font-weight: 800; cursor: pointer; }
.aviso { font-size: .7rem; color: #8b949e; text-align: center; padding: 6px; }

<p class="aviso">O que NÃO garante: jogo offline para crianças — a voz e os sons vivem no aparelho; nada é enviado para lado nenhum; é brincadeira com régua, não documento legal.</p>
<script>
var audioCtx = null; var counted = 0; var isSame = true;
var NOTES = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
function beep(freq, dur){ dur = dur || 0.25; if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); var o=audioCtx.createOscillator(); var g=audioCtx.createGain(); o.type='sine'; o.frequency.setValueAtTime(freq, audioCtx.currentTime); g.gain.setValueAtTime(0.35, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur); }
function speak(text){ if('speechSynthesis' in window){ window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang='pt-PT'; u.rate=0.9; window.speechSynthesis.speak(u); } }
function speakGuide(){ beep(523.25,0.2); speak('Olá! Bem-vindo às Girafinhas. Em cima, toca em cada tigela amarela para contar até oito. Em baixo, toca no botão azul para ver quando as duas girafas são iguais ou diferentes!'); }
var grid = document.getElementById('bowlsGrid');
for(var i=0;i<8;i++){ (function(idx){ var btn=document.createElement('button'); btn.className='bowl'; btn.textContent = idx===7 ? '🥣💙' : '🥣'; btn.onclick=function(){ if(!btn.classList.contains('counted')){ btn.classList.add('counted'); beep(NOTES[counted%NOTES.length],0.3); counted++; document.getElementById('bowlCountText').textContent = counted + ' de 8 ⭐'; if(counted===8){ speak('Parabéns! Encontraste todas as oito tigelas, até a tigela azul escondida!'); } } }; grid.appendChild(btn); })(i); }
function toggleRuler(){ isSame = !isSame; var box=document.getElementById('rulerVisual'); if(isSame){ box.className='ruler-box ruler-same'; box.innerHTML='🦒🌿 = 🦒🌿<br>IGUAL!'; beep(523.25,0.2); setTimeout(function(){beep(659.25,0.25);},140); speak('Igual! As duas imagens são exatamente iguais.'); } else { box.className='ruler-box ruler-diff'; box.innerHTML='🦒🌿 ≠ 🦒🌸<br>DIFERENTE!'; beep(220,0.35); speak('Diferente! A régua apanhou uma mudança.'); } }
</script>
